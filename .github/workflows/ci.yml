name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate premium asset stubs (no premium packs -> empty stubs)
        run: bun scripts/build-premium-pack.mjs
      - name: Type check
        run: bun run typecheck
      - name: Unit tests
        run: bun test
      - name: Build standalone binary
        run: bun run build
      # Smoke-test the compiled binary. These subcommands don't need ffmpeg
      # or whisper, and they fail hard if the preset index imports a preset
      # that isn't shipped (guards the free-only public build).
      - name: CLI smoke test
        run: |
          ./dist/captions --help
          ./dist/captions --list-engines
          ./dist/captions --list-presets
          ./dist/captions --list-presets --engine hf

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image (free pack)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.full
          push: false
          tags: captions-cli:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
